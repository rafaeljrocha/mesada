name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mesada
          POSTGRES_PASSWORD: mesada
          POSTGRES_DB: mesada_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mesada"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Testes com SQLite
        run: pytest
      - name: Testes com PostgreSQL (inclui concorrência)
        env:
          TEST_DATABASE_URL: postgresql://mesada:mesada@localhost:5432/mesada_teste
        run: pytest
      - name: Migrations em sincronia com os modelos
        env:
          APP_ENV: desenvolvimento
          DATABASE_URL: postgresql://mesada:mesada@localhost:5432/mesada_teste
        run: |
          flask --app wsgi db upgrade
          flask --app wsgi db check
